version: 2

# Private bliptrace-* modules (e.g. bliptrace-contracts) need a token.
# Add the GH_PAT fine-grained token to the org's *Dependabot* secrets.
registries:
  github-bliptrace:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{ secrets.GH_PAT }}

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    registries:
      - github-bliptrace
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
